name: Bug report
description: Something does not work, crashes or ranks items wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! The more of this you fill in, the faster it can be fixed.
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: e.g. 1.21.1
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      options: [NeoForge, Fabric, Forge]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Best in Pack version (file name)
      placeholder: e.g. BestInPack-neoforge-1.21-1.21.1-0.9.3.jar
    validations:
      required: true
  - type: input
    id: pack
    attributes:
      label: Modpack or other mods
      description: Name and version of the modpack, or the mods that matter (JEI, EMI, REI, …)
      placeholder: e.g. All the Mods 10 8.4
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For wrong rankings, name the item and where you think it should be.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log or crash report
      description: Upload logs/latest.log or the crash report (or paste a link to a paste site).
      render: text
